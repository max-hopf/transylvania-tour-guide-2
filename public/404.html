<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // Single Page Apps for GitHub Pages
      (function() {
        var segment = 0;
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + segment).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(segment).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      })();
    </script>
  </head>
  <body>
    <h1>Redirecting...</h1>
    <a href="index.html">Click here if you are not redirected.</a>
    <script>document.location.href = 'index.html' + (window.location.search || '?') + '&redirect=' + encodeURIComponent(window.location.pathname + window.location.hash);</script>
  </body>
</html>
